name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - 'params.yaml'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --force-reinstall "setuptools<72"

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --force-reinstall "setuptools<72"


      - name: Authenticate to Cloud Storage
        env:
          GCP_SA_KEY: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/sa-key.json
          python -c "import json; k = json.load(open('/tmp/sa-key.json')); print('Authenticated as:', k.get('client_email'))"
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
          dvc remote modify labstore credentialpath /tmp/sa-key.json --local

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc -v

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        # TODO 4: Doc gia tri "f1_score" tu outputs/report.json bang Python inline.
        #         Set ket qua thanh output "f1" de job quality-gate co the doc.
        #
        # Goi y:
        #   F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
        #   echo "f1=$F1" >> $GITHUB_OUTPUT
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET || 'raiju' }}
        run: |
          python -c "
          import os
          from google.cloud import storage
          bucket_name = os.environ.get('ARTIFACT_BUCKET') or 'raiju'
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob('artifacts/current/model.joblib')
          blob.upload_from_filename('models/model.joblib')
          print('Model uploaded successfully to gs://' + bucket_name + '/artifacts/current/model.joblib')
          "

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        env:
          F1_VAL: ${{ needs.train.outputs.f1 }}
        run: |
          python -c "
          import os
          f1 = float(os.environ.get('F1_VAL', '0'))
          print(f'Received F1: {f1}')
          if f1 < 0.65:
              raise SystemExit(f'FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.')
          print(f'PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.')
          "


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '34.171.90.180' }}
          username: ${{ secrets.SERVER_USER || 'raiju' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
# trigger
